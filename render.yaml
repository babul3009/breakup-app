services:
  - type: web
    name: breakup-app
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    plan: free
    envVars:
      - { key: NODE_VERSION, value: 20.18.1 }
      - { key: NODE_ENV, value: production }
      - { key: JWT_SECRET, generateValue: true }
      - { key: DB_FILE, value: data.db }
    # No disk on the free plan: this SQLite file resets on every deploy/restart.
    # Fine for a portfolio demo. For real users, add a paid instance + disk (see README),
    # or switch to a hosted Postgres database.
